version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: epicbook-mysql
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
      - ./db/BuyTheBook_Schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./db/author_seed.sql:/docker-entrypoint-initdb.d/2-authors.sql
      - ./db/books_seed.sql:/docker-entrypoint-initdb.d/3-books.sql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: pratyushpahari/epicbook-app:latest
    build:
      context: .
      target: production
    container_name: epicbook-app
    restart: unless-stopped
    env_file: .env
    networks:
      - backend-network
      - frontend-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: epicbook-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - frontend-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend-network:
  backend-network:

volumes:
  db-data:
