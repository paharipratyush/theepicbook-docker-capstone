trigger:
  - main

variables:
  dockerRegistryConnection: 'DockerHubConnection'
  imageRepository: 'pratyushpahari/epicbook-app'
  tag: '$(Build.SourceVersion)'

stages:
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: 'Build and push image to Docker Hub'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        containerRegistry: $(dockerRegistryConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Production VM
  dependsOn: Build
  jobs:
  - job: Deploy
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: SSH@0
      displayName: 'Deploy via Docker Compose on VM'
      inputs:
        sshEndpoint: 'AzureVM_SSH'
        runOptions: 'inline'
        inline: |
          cd ~/theepicbook
          docker-compose pull app
          docker-compose --compatibility up -d --no-deps app
